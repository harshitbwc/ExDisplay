name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  mac:
    name: Mac host (build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build
        working-directory: mac
        run: swift build -c release
      - name: Test
        working-directory: mac
        env:
          EXDISPLAY_TESTS: "1"
        run: swift test

  android:
    name: Android client (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner image ships the Android SDK; android-actions/setup-android@v3 currently
      # fails on its `sdkmanager tools` call, so just accept licenses for Gradle's auto-install.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
