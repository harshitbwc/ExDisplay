name: Release

# Push a tag like v1.2.0 (must match the VERSION file) to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION ($(cat VERSION))"; exit 1; }

  mac:
    needs: check-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build ExDisplay.app (ad-hoc signed)
        working-directory: mac
        run: bash make-app.sh
      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ditto -c -k --keepParent mac/ExDisplay.app "ExDisplay-${VERSION}-mac-arm64.zip"
          shasum -a 256 "ExDisplay-${VERSION}-mac-arm64.zip" > "ExDisplay-${VERSION}-mac-arm64.zip.sha256"
          # Fixed-name copy so .../releases/latest/download/ExDisplay-mac-arm64.zip never changes.
          cp "ExDisplay-${VERSION}-mac-arm64.zip" ExDisplay-mac-arm64.zip
          shasum -a 256 ExDisplay-mac-arm64.zip > ExDisplay-mac-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ExDisplay-*

  android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner image ships the Android SDK; android-actions/setup-android@v3 currently
      # fails on its `sdkmanager tools` call, so just accept licenses for Gradle's auto-install.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          EXDISPLAY_KEYSTORE: ${{ runner.temp }}/release.jks
          EXDISPLAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXDISPLAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXDISPLAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cp android/app/build/outputs/apk/release/app-release.apk "ExDisplay-${VERSION}-android.apk"
          sha256sum "ExDisplay-${VERSION}-android.apk" > "ExDisplay-${VERSION}-android.apk.sha256"
          # Fixed-name copy so .../releases/latest/download/ExDisplay-android.apk never changes.
          cp "ExDisplay-${VERSION}-android.apk" ExDisplay-android.apk
          sha256sum ExDisplay-android.apk > ExDisplay-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ExDisplay-*

  publish:
    needs: [mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          # Release notes = the matching CHANGELOG section.
          awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} /^---/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "ExDisplay ${VERSION}" --notes-file notes.md
